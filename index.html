<style>

<script>
'use strict';
/* ===== REGLAS FINANCIERAS (única fuente de verdad: objeto C) =====
 Ingresos recibidos = suma de ingresos 'Recibido' del período. Pendientes se muestran aparte.
 Gastos pagados = gastos 'Pagado'. Gastos pendientes = obligaciones futuras, no restan del efectivo.
 Balance disponible = Ahorro neto = ingresos recibidos - gastos pagados (por período, sin arrastre).
 % ahorro = neto / ingresos recibidos * 100 (sin ingresos: "—").
 Gasto imputado al presupuesto = gastos pagados + pendientes del período (compromiso).
 Presupuesto restante = presupuesto - imputado; % ejecución = imputado / presupuesto (sin presupuesto: "—").
 Pago de deuda = UN gasto (categoría Deudas) vinculado a la deuda; el saldo = saldo inicial - pagos hechos (mín. 0). */
const BASE='presupuesto.v1',USERS='presupuesto.users',BAD=['__proto__','constructor','prototype'];let KEY=BASE,BAK=BASE+'.bak',CU=null,R={list:[]},LS={mode:'pick',id:''},loggedOut=false,fails=0,lockUntil=0;
const DEF_INC=['Salario','Negocios','Freelance','Inversiones','Comisiones','Ingresos adicionales','Otros'];
const DEF_EXP=['Vivienda','Alimentación','Transporte','Servicios públicos','Salud','Educación','Entretenimiento','Suscripciones','Deudas','Compras personales','Familia','Imprevistos','Otros'];
const FREQ={unico:'Único',semanal:'Semanal',quincenal:'Quincenal',mensual:'Mensual',anual:'Anual'};
const mem={},store={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){mem[k]=v;return false}},del(k){try{localStorage.removeItem(k)}catch(e){}delete mem[k]}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n+Number.EPSILON)*100)/100;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&ymd(new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8)))===s;
const addM=(ym,n)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const dim=(y,m)=>new Date(y,m,0).getDate();
const def=()=>({v:1,settings:{name:'Mi presupuesto',currency:'COP',symbol:'$',startDay:1,theme:'auto',pageSize:15,accent:'',anim:'letras',speed:'normal'},cats:{inc:[...DEF_INC],exp:[...DEF_EXP]},tx:[],budget:{general:0,cats:{}},goals:[],debts:[],reminders:[],skipped:[]});
let S=def(),ym='',view='dash',saveFailed=false;
let anim=false,prevIdx=0,lastCur='',lastDay='';const SP={fast:.6,normal:1,slow:1.6},ACC=[['Esmeralda','#0f766e'],['Azul','#2563eb'],['Violeta','#7c3aed'],['Rosa','#db2777'],['Naranja','#ea580c'],['Dorado','#b7791f'],['Verde','#15803d'],['Grafito','#334155']];
const ui={q:'',type:'',cat:'',scope:'month',sort:'date',dir:-1,page:1};

/* ===== Persistencia e importación segura ===== */
function clean(o){
  if(!o||typeof o!=='object'||Array.isArray(o))throw new Error('El archivo no es un respaldo válido.');
  const d=def(),str=(v,n=120)=>typeof v==='string'?v.trim().slice(0,n):'',num=v=>{v=Number(v);return Number.isFinite(v)&&v>=0&&v<1e13?r2(v):0};
  const id=v=>typeof v==='string'&&/^[\w-]{1,40}$/.test(v)?v:uid(),en=(v,a,x)=>a.includes(v)?v:x;
  const s=o.settings&&typeof o.settings==='object'?o.settings:{};
  d.settings={name:str(s.name,60)||d.settings.name,currency:en(s.currency,['COP','USD','EUR','MXN'],'COP'),symbol:str(s.symbol,4)||'$',startDay:Math.min(28,Math.max(1,parseInt(s.startDay)||1)),theme:en(s.theme,['auto','light','dark'],'auto'),pageSize:en(+s.pageSize,[10,15,25,50],15),accent:/^#[0-9a-f]{6}$/i.test(s.accent)?s.accent.toLowerCase():'',anim:en(s.anim,['letras','desliza','zoom','cortina','off'],'letras'),speed:en(s.speed,['fast','normal','slow'],'normal')};
  for(const k of['inc','exp']){const a=o.cats&&Array.isArray(o.cats[k])?o.cats[k].map(x=>str(x,40)).filter(x=>x&&!BAD.includes(x)):[];d.cats[k]=a.length?[...new Set(a)]:d.cats[k]}
  const ts=['done','pending'];
  d.tx=(Array.isArray(o.tx)?o.tx:[]).slice(0,50000).filter(t=>t&&typeof t==='object'&&['inc','exp'].includes(t.type)&&validDate(t.date)&&num(t.amt)>0).map(t=>{
    const c=str(t.cat,40)||'Otros';if(BAD.includes(c))return null;if(!d.cats[t.type].includes(c))d.cats[t.type].push(c);
    return{id:id(t.id),type:t.type,desc:str(t.desc)||'Sin descripción',cat:c,amt:num(t.amt),date:t.date,kind:str(t.kind,30),method:str(t.method,30),status:en(t.status,ts,'done'),freq:t.type==='exp'?en(t.freq,Object.keys(FREQ),'unico'):'unico',notes:str(t.notes,400),recurOf:t.recurOf?id(t.recurOf):'',debtId:t.debtId?id(t.debtId):''}}).filter(Boolean);
  d.budget.general=num(o.budget&&o.budget.general);
  if(o.budget&&o.budget.cats&&typeof o.budget.cats==='object')for(const[k,v]of Object.entries(o.budget.cats)){if(BAD.includes(k)||!k)continue;const n=num(v);if(n>0)d.budget.cats[k.slice(0,40)]=n}
  d.goals=(Array.isArray(o.goals)?o.goals:[]).slice(0,500).filter(g=>g&&num(g.target)>0).map(g=>({id:id(g.id),name:str(g.name,80)||'Objetivo',target:num(g.target),saved:num(g.saved),deadline:validDate(g.deadline)?g.deadline:'',prio:en(g.prio,['alta','media','baja'],'media'),monthly:num(g.monthly),desc:str(g.desc,300)}));
  d.debts=(Array.isArray(o.debts)?o.debts:[]).slice(0,500).filter(x=>x&&typeof x==='object').map(x=>({id:id(x.id),name:str(x.name,80)||'Deuda',creditor:str(x.creditor,80),total:num(x.total),balance:num(x.balance),rate:Math.min(1000,num(x.rate)),monthly:num(x.monthly),due:validDate(x.due)?x.due:'',notes:str(x.notes,300)}));
  const dids=new Set(d.debts.map(x=>x.id));d.tx.forEach(t=>{if(t.debtId&&!dids.has(t.debtId))t.debtId=''});
  d.reminders=(Array.isArray(o.reminders)?o.reminders:[]).slice(0,2000).filter(r=>r&&typeof r==='object'&&validDate(r.date)&&str(r.title)).map(r=>({id:id(r.id),title:str(r.title,80),date:r.date,amt:num(r.amt),repeat:en(r.repeat,['none','weekly','monthly','yearly'],'none'),lead:Math.min(30,Math.max(0,parseInt(r.lead)||0)),notes:str(r.notes,300),done:(Array.isArray(r.done)?r.done:[]).filter(x=>validDate(x)).slice(0,1000)}));
  d.skipped=(Array.isArray(o.skipped)?o.skipped:[]).filter(x=>typeof x==='string').slice(0,5000).map(x=>x.slice(0,80));
  return d}
function load(){S=def();const raw=store.get(KEY);if(!raw)return;
  try{S=clean(JSON.parse(raw));store.set(BAK,raw)}
  catch(e){const b=store.get(BAK);try{if(b){S=clean(JSON.parse(b));setTimeout(()=>toast('Datos dañados: se recuperó la última copia válida.'),300);return}}catch(_){}
    store.set(KEY+'.corrupt',raw);S=def();setTimeout(()=>toast('No se pudieron leer los datos guardados; se conservó una copia aparte.'),300)}}
function persist(){if(!CU)return;saveFailed=!store.set(KEY,JSON.stringify(S));if(saveFailed)toast('No se pudo guardar en el navegador. Exporta un respaldo.')}

/* ===== Usuarios (perfiles locales; cada uno con su propia clave de almacenamiento) ===== */
const rd=()=>{try{const o=JSON.parse(store.get(USERS)||'null');if(o&&Array.isArray(o.list))return{list:o.list.filter(u=>u&&typeof u==='object'&&typeof u.id==='string'&&/^[\w-]{1,40}$/.test(u.id)&&typeof u.name==='string'&&u.name.trim()).slice(0,50).map(u=>({id:u.id,name:u.name.trim().slice(0,40),salt:typeof u.salt==='string'?u.salt.slice(0,40):'',hash:typeof u.hash==='string'?u.hash.slice(0,80):''}))}}catch(e){}return{list:[]}};
const wr=()=>store.set(USERS,JSON.stringify(R));
async function hp(pin,salt){const s=salt+':'+pin;if(globalThis.crypto&&crypto.subtle){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return'S'+[...new Uint8Array(b)].map(x=>pad(x.toString(16))).join('')}catch(e){}}
  let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return'F'+(b>>>0).toString(16)+(a>>>0).toString(16)}
function enter(u,fresh){CU=u;KEY=BASE+'.u.'+u.id;BAK=KEY+'.bak';load();if(fresh){S.settings.name='Presupuesto de '+u.name;persist()}ym=curYM();genRecurring(ym);view='dash';anim=true;lastCur=ym;Object.assign(ui,{day:'',q:'',type:'',cat:'',scope:'month',sort:'date',dir:-1,page:1,from:'',to:''});LS={mode:'pick',id:''};render()}
function renderLogin(){document.querySelector('.app').dataset.login='1';applyLook();document.title='Presupuesto mensual';$('#nav').innerHTML='';let h;const u=R.list.find(x=>x.id===LS.id);
  if(LS.mode==='new'||!R.list.length)h=`<h1>Crear usuario</h1><p class="lbl">Cada usuario tiene su propio presupuesto, movimientos, objetivos y deudas.</p><form id="nf" novalidate><label>Nombre<input name="name" maxlength="40" autocomplete="off" autofocus></label><label>PIN opcional (4 a 8 dígitos)<input name="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></label><label>Repetir PIN<input name="pin2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></label><div class="err" id="le" role="alert"></div><div class="row" style="margin-top:14px"><button class="btn">Crear y entrar</button>${R.list.length?'<button type="button" class="btn s" data-a="lpick">Volver</button>':''}</div></form>`;

  else h=`<h1>¿Quién usa el presupuesto?</h1>`+R.list.map(x=>`<button class="ubtn" data-a="login" data-id="${x.id}"><span>${esc(x.name)}</span><span class="lbl">${x.hash?'Con PIN':'Sin PIN'}</span></button>`).join('')+`<div class="row" style="margin-top:14px"><button class="btn" data-a="lnew">+ Nuevo usuario</button></div>`;

    incR=r2(incR);incP=r2(incP);expP=r2(expP);expN=r2(expN);

    return{ym:m,L,incR,incP,expP,expN,net,balance:net,savePct:incR>0?net/incR*100:null,budget:g,imputed:imp,remaining:g>0?r2(g-imp):null,usedPct:g>0?imp/g*100:null,cat,inc}},
  catRows(mo){const names=new Set([...Object.keys(S.budget.cats),...Object.keys(mo.cat)]);

  paid(d){return r2(S.tx.filter(t=>t.debtId===d.id&&t.status==='done').reduce((a,t)=>a+t.amt,0))},
  debtBal(d){return Math.max(0,r2(d.balance-C.paid(d)))},
  goal(g){const left=Math.max(0,r2(g.target-g.saved)),p=Math.min(100,g.target>0?g.saved/g.target*100:0);let need=null,late=false;
    if(left>0&&g.deadline){const days=(new Date(g.deadline+'T00:00')-new Date(today()+'T00:00'))/864e5;late=days<0;need=late?left:r2(left/Math.max(1,Math.ceil(days/30.44)))}

  events(s,e){const t=today(),out=[],add=o=>out.push({amt:0,lead:3,done:false,...o,overdue:!o.done&&o.date<t&&['pay','inc','debt','rem'].includes(o.kind)});
    const have=new Set(S.tx.filter(x=>x.recurOf).map(x=>x.recurOf+'|'+x.date)),sk=new Set(S.skipped);
    for(const x of S.tx)if(x.date>=s&&x.date<=e)add({date:x.date,kind:x.type==='exp'?'pay':'inc',title:x.desc,amt:x.amt,done:x.status==='done',id:x.id});
    for(const d of S.debts){const b=C.debtBal(d);if(b>0&&d.due&&d.due>=s&&d.due<=e)add({date:d.due,kind:'debt',title:'Vence: '+d.name,amt:d.monthly>0?Math.min(d.monthly,b):b,id:d.id})}

    for(const x of S.tx.filter(x=>x.type==='exp'&&!x.recurOf&&x.freq!=='unico'))for(const k of occ(x,s,e)){const key=x.id+'|'+k;if(k>=t&&!have.has(key)&&!sk.has(key))add({date:k,kind:'proj',title:x.desc,amt:x.amt,id:x.id})}

  upcoming(){const t=today(),n=new Date(),far=ymd(new Date(n.getFullYear(),n.getMonth(),n.getDate()+14)),past=ymd(new Date(n.getFullYear(),n.getMonth(),n.getDate()-400)),all=C.events(past,far).filter(e=>!e.done&&e.kind!=='goal');

};

function remOcc(r,s,e){if(r.repeat==='none')return r.date>=s&&r.date<=e?[r.date]:[];const b=new Date(r.date+'T00:00'),out=[];
  if(r.repeat==='weekly'){for(let i=0;i<3000;i++){const k=ymd(new Date(b.getFullYear(),b.getMonth(),b.getDate()+7*i));if(k>e)break;if(k>=s)out.push(k)}}
  else{let m=s.slice(0,7);while(m<=e.slice(0,7)){const y=+m.slice(0,4),mo=+m.slice(5,7);if(r.repeat==='monthly'||mo-1===b.getMonth()){const k=`${m}-${pad(Math.min(b.getDate(),dim(y,mo)))}`;if(k>=r.date&&k>=s&&k<=e)out.push(k)}m=addM(m,1)}}

function occ(t,s,e){const out=[],b=new Date(t.date+'T00:00');
  if(t.freq==='semanal'||t.freq==='quincenal'){const st=t.freq==='semanal'?7:15;for(let i=1;i<3000;i++){const k=ymd(new Date(b.getFullYear(),b.getMonth(),b.getDate()+st*i));if(k>e)break;if(k>=s)out.push(k)}}
  else if(t.freq==='mensual'||t.freq==='anual'){let m=s.slice(0,7);while(m<=e.slice(0,7)){const y=+m.slice(0,4),mo=+m.slice(5,7);if(t.freq==='mensual'||mo-1===b.getMonth()){const k=`${m}-${pad(Math.min(b.getDate(),dim(y,mo)))}`;if(k>=s&&k<=e&&k>t.date)out.push(k)}m=addM(m,1)}}
  return out}
function genRecurring(m){const[s,e]=range(m);if(s>today())return 0;let n=0;const have=new Set(S.tx.filter(t=>t.recurOf).map(t=>t.recurOf+'|'+t.date)),sk=new Set(S.skipped);
  for(const t of S.tx.filter(t=>t.type==='exp'&&!t.recurOf&&t.freq!=='unico'))for(const k of occ(t,s,e)){const key=t.id+'|'+k;if(have.has(key)||sk.has(key))continue;have.add(key);

function applyLook(){const t=S.settings,r=document.documentElement,dark=t.theme==='auto'?matchMedia('(prefers-color-scheme:dark)').matches:t.theme==='dark';r.dataset.theme=dark?'dark':'light';r.style.setProperty('--sp',SP[t.speed]||1);
  if(/^#[0-9a-f]{6}$/i.test(t.accent)){let c=[1,3,5].map(i=>parseInt(t.accent.substr(i,2),16));if(dark)c=c.map(v=>Math.round(v*.78+255*.22));const L=(.2126*c[0]+.7152*c[1]+.0722*c[2])/255;r.style.setProperty('--acc','rgb('+c.join(',')+')');r.style.setProperty('--onacc',L>.6?'#111':'#fff')}
  else{r.style.removeProperty('--acc');r.style.removeProperty('--onacc')}}
const ttl=(t,go)=>go&&S.settings.anim==='letras'?[...t].map((c,i)=>`<span style="--i:${i}">${c===' '?'&nbsp;':esc(c)}</span>`).join(''):esc(t);
function play(go){const m=$('#main'),mode=S.settings.anim,idx=Object.keys(V).indexOf(view);m.className=go?'an an-'+mode:'';m.style.setProperty('--dx',(idx>=prevIdx?1:-1)*70+'px');prevIdx=idx;if(!go)return;
  m.querySelectorAll('.stage>*:not(.grid),.stage .grid>*').forEach((e,i)=>e.style.setProperty('--k',Math.min(i,14)));
  if(mode==='cortina'){const c=document.createElement('div');c.id='curtain';c.innerHTML=`<span>${esc(V[view][0])}</span>`;document.body.appendChild(c);setTimeout(()=>c.remove(),1150*(SP[S.settings.speed]||1))}}

function alerts(mo){const A=[];
  if(mo.usedPct!=null){const c=mo.usedPct>=100?'o':'';if(mo.usedPct>=75)A.push(`<div class="alert ${c}">Presupuesto general al ${pct(mo.usedPct)}${mo.usedPct>=100?': excedido por '+fmt(mo.imputed-mo.budget):''}.</div>`)}
  for(const r of C.catRows(mo))if(r.pct!=null&&r.pct>=75)A.push(`<div class="alert ${r.pct>=100?'o':''}">${esc(r.name)}: ${pct(r.pct)} de su presupuesto${r.over>0?' (exceso '+fmt(r.over)+')':''}.</div>`);
  if(mo.net<0)A.push(`<div class="alert o">Has pagado más de lo recibido este período (${fmt(mo.net)}).</div>`);return A.join('')}
function dueBanner(){const up=C.upcoming(),t=today(),al=e=>ALERT.includes(e.kind),od=up.overdue.filter(al),td=up.today.filter(al),sn=up.soon.filter(e=>al(e)&&dd(t,e.date)<=e.lead),sum=a=>r2(a.reduce((x,e)=>x+e.amt,0));let h='';
  if(od.length)h+=`<div class="alert o">${od.length} vencimiento${od.length>1?'s':''} atrasado${od.length>1?'s':''}${sum(od)?' por '+fmt(sum(od)):''}. <button class="btn sm s" data-a="nav" data-v="cal">Ver calendario</button></div>`;

  if(sn.length)h+=`<div class="alert i">Próximos: ${sn.slice(0,3).map(e=>esc(e.title)+' ('+rel(dd(t,e.date))+')').join(', ')}${sn.length>3?'…':''}.</div>`;return h}
function upList(up){const t=today(),rows=[...up.overdue,...up.today,...up.soon];if(!rows.length)return emptyBox('Sin vencimientos pendientes en los próximos 14 días.');

function vCal(){const[s,e]=range(ym),t=today(),evs=C.events(s,e),by={};evs.forEach(x=>(by[x.date]=by[x.date]||[]).push(x));

function vDash(){const mo=C.month(ym),pv=C.month(addM(ym,-1)),dlt=(a,b)=>b===0?(a===0?'sin cambio':'sin base previa'):((a-b)/b*100>0?'+':'')+pct((a-b)/b*100);
  const k=(l,v,s,c='')=>`<div class="card kpi"><div class="lbl">${l}</div><div class="v num ${c}">${v}</div><div class="lbl">${s||'&nbsp;'}</div></div>`;

   ${k('Ingresos pendientes',fmt(mo.incP),'No suman al balance')}${k('Gastos pendientes',fmt(mo.expN),'Obligaciones futuras','warn')}
   ${k('Presupuesto mensual',mo.budget>0?fmt(mo.budget):'Sin definir',mo.budget>0?'':'Defínelo en Presupuesto')}${k('Presupuesto utilizado',pct(mo.usedPct),mo.remaining!=null?'Restante: '+fmt(mo.remaining):'Sin presupuesto no hay porcentaje',mo.usedPct>=100?'neg':'')}</div>

function filtered(){let L=ui.scope==='month'?C.txIn(ym):[...S.tx];const q=ui.q.toLowerCase();
  L=L.filter(t=>(!ui.type||t.type===ui.type)&&(!ui.cat||t.cat===ui.cat)&&(!q||(t.desc+' '+t.cat+' '+t.notes).toLowerCase().includes(q)));
  if(ui.from)L=L.filter(t=>t.date>=ui.from);if(ui.to)L=L.filter(t=>t.date<=ui.to);
  const k=ui.sort;L.sort((a,b)=>(k==='amt'?a.amt-b.amt:String(a[k]).localeCompare(String(b[k]),'es'))*ui.dir||a.date.localeCompare(b.date));return L}
function vTx(){const L=filtered(),ps=S.settings.pageSize,pg=Math.max(1,Math.ceil(L.length/ps));ui.page=Math.min(ui.page,pg);const rows=L.slice((ui.page-1)*ps,ui.page*ps);
  const allc=[...new Set([...S.cats.inc,...S.cats.exp])].sort(),th=(k,l,c='')=>`<th class="${c}" data-a="sort" data-k="${k}" aria-sort="${ui.sort===k?(ui.dir>0?'ascending':'descending'):'none'}">${l}${ui.sort===k?(ui.dir>0?' ↑':' ↓'):''}</th>`;

function vBudget(){const mo=C.month(ym),rows=C.catRows(mo),alloc=r2(Object.values(S.budget.cats).reduce((a,b)=>a+b,0));

function vInsights(){const mo=C.month(ym),pv=C.month(addM(ym,-1)),I=[],ok=mo.L.length>0;
  if(!ok)return`<div class="card">${emptyBox('Aún no hay datos en este período. Registra movimientos y aquí verás análisis basados solo en ellos.')}</div>`;
  const top=Object.entries(mo.cat).sort((a,b)=>b[1]-a[1])[0];if(top)I.push(`Tu mayor gasto es <b>${esc(top[0])}</b>: ${fmt(r2(top[1]))}${mo.imputed>0?' ('+pct(top[1]/mo.imputed*100)+' del total imputado)':''}.`);
  C.catRows(mo).filter(r=>r.over>0).forEach(r=>I.push(`<b>${esc(r.name)}</b> superó su presupuesto por ${fmt(r.over)}.`));
  if(pv.expP>0&&mo.expP>=0){const v=(mo.expP-pv.expP)/pv.expP*100;I.push(`Tus gastos pagados ${v>=0?'subieron':'bajaron'} ${pct(Math.abs(v))} frente al mes anterior (${fmt(pv.expP)} → ${fmt(mo.expP)}).`)}else I.push('No hay gastos pagados el mes anterior para comparar.');
  I.push(mo.incR>0?`Capacidad de ahorro confirmada: ${fmt(mo.net)} (${pct(mo.savePct)} de lo recibido).${mo.savePct<10?' Ahorras menos del 10 %; revisa categorías discrecionales.':''}`:'Aún no hay ingresos recibidos: no se puede calcular el ahorro.');
  if(mo.incP>0)I.push(`Tienes ${fmt(mo.incP)} en ingresos pendientes; no se cuentan hasta marcarlos como recibidos.`);
  const rec=S.tx.filter(t=>t.type==='exp'&&!t.recurOf&&t.freq!=='unico');if(rec.length)I.push(`Gastos recurrentes configurados: ${rec.map(t=>esc(t.desc)+' ('+FREQ[t.freq].toLowerCase()+', '+fmt(t.amt)+')').join('; ')}.`);
  const wd=[0,0,0,0,0,0,0];mo.L.filter(t=>t.type==='exp'&&t.status==='done').forEach(t=>wd[new Date(t.date+'T00:00').getDay()]+=t.amt);const mx=Math.max(...wd);
  if(mx>0)I.push(`El día de la semana con más gasto pagado es el <b>${['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][wd.indexOf(mx)]}</b> (${fmt(r2(mx))}).`);
  const[s,e]=range(ym),t=today();if(t>=s&&t<=e){const el=Math.round((new Date(t+'T00:00')-new Date(s+'T00:00'))/864e5)+1,tot=Math.round((new Date(e+'T00:00')-new Date(s+'T00:00'))/864e5)+1;
    I.push(`<b>Estimación (no es un dato confirmado):</b> a este ritmo, los gastos pagados cerrarían cerca de ${fmt(norm(mo.expP/el*tot))}.`)}
  return`<div class="card"><h3>Observaciones de ${mlabel(ym)}</h3><ul style="padding-left:18px">${I.map(x=>`<li style="margin:9px 0">${x}</li>`).join('')}</ul></div>`}
function vSettings(){const s=S.settings,cl=k=>S.cats[k].map(c=>`<span class="tag" style="margin:2px">${esc(c)} <button data-a="rc" data-k="${k}" data-c="${esc(c)}" aria-label="Quitar ${esc(c)}" style="all:unset;cursor:pointer">×</button></span>`).join('');
  return`<div class="card"><h3>Configuración</h3><form id="sf" novalidate><div class="grid"><label>Nombre del presupuesto<input name="name" value="${esc(s.name)}" maxlength="60"></label>
  <label>Moneda<select name="currency">${['COP','USD','EUR','MXN'].map(c=>`<option${c===s.currency?' selected':''}>${c}</option>`).join('')}</select></label><label>Símbolo<input name="symbol" value="${esc(s.symbol)}" maxlength="4"></label>
  <label>Primer día del período<input name="startDay" type="number" min="1" max="28" value="${s.startDay}"></label><label>Tema<select name="theme">${[['auto','Automático'],['light','Claro'],['dark','Oscuro']].map(o=>`<option value="${o[0]}"${o[0]===s.theme?' selected':''}>${o[1]}</option>`).join('')}</select></label>
  <label>Filas por página<select name="pageSize">${[10,15,25,50].map(n=>`<option${n===s.pageSize?' selected':''}>${n}</option>`).join('')}</select></label></div><div class="err" id="se"></div><button class="btn" style="margin-top:12px">Guardar configuración</button></form>
  <p class="lbl">Al cambiar de moneda no se convierten los importes guardados, solo cambia el formato.</p></div>
  <div class="card" style="margin-top:14px"><h3>Apariencia</h3><p class="lbl">Color principal</p><div class="row">${ACC.map(a=>`<button class="sw" data-a="acc" data-c="${a[1]}" style="background:${a[1]}" title="${a[0]}" aria-label="${a[0]}" aria-pressed="${s.accent===a[1]}"></button>`).join('')}<label class="row" style="margin:0">Personalizado <input type="color" id="ac" value="${s.accent||'#0f766e'}" style="width:46px;height:34px;padding:2px"></label><button class="btn s sm" data-a="acc" data-c="">Restablecer</button></div>
  <div class="grid" style="margin-top:6px"><label>Animación al cambiar de sección<select id="an">${[['letras','Letras que saltan'],['desliza','Deslizar con dirección'],['zoom','Zoom con enfoque'],['cortina','Cortina de color'],['off','Sin animación']].map(o=>`<option value="${o[0]}"${o[0]===s.anim?' selected':''}>${o[1]}</option>`).join('')}</select></label>
  <label>Velocidad<select id="asp">${[['fast','Rápida'],['normal','Normal'],['slow','Lenta']].map(o=>`<option value="${o[0]}"${o[0]===s.speed?' selected':''}>${o[1]}</option>`).join('')}</select></label></div><div class="row" style="margin-top:12px"><button class="btn" data-a="prev">Probar animación</button></div><p class="lbl">Se respeta la preferencia «reducir movimiento» de tu sistema. Cada usuario guarda su propia apariencia.</p></div>
  <div class="card" style="margin-top:14px"><h3>Categorías</h3><p class="lbl">Ingresos</p>${cl('inc')}<div class="row"><input id="ni" placeholder="Nueva categoría de ingreso" style="max-width:260px"><button class="btn s sm" data-a="ac" data-k="inc">Añadir</button></div>
  <p class="lbl">Gastos</p>${cl('exp')}<div class="row"><input id="ne" placeholder="Nueva categoría de gasto" style="max-width:260px"><button class="btn s sm" data-a="ac" data-k="exp">Añadir</button></div></div>
  <div class="card" style="margin-top:14px"><h3>Usuario: ${esc(CU.name)}</h3><p class="lbl">${CU.hash?'Protegido con PIN.':'Sin PIN.'} Los datos de cada usuario están completamente separados.</p><div class="row"><button class="btn s" data-a="rname">Cambiar nombre</button><button class="btn s" data-a="rpin">${CU.hash?'Cambiar o quitar PIN':'Crear PIN'}</button><button class="btn d" data-a="ddelu">Eliminar usuario</button></div></div>
  <div class="card" style="margin-top:14px"><h3>Datos y respaldo</h3><p class="lbl">Los respaldos, importaciones y «Borrar todo» afectan solo a este usuario. Todo se guarda solo en este navegador. Exporta respaldos con regularidad.</p><div class="row"><button class="btn" data-a="xcsv">Exportar CSV</button><button class="btn" data-a="xjson">Respaldo JSON</button><button class="btn s" data-a="imp">Importar respaldo</button><button class="btn d" data-a="reset">Borrar todo</button></div><input type="file" id="fi" accept=".json,application/json" hidden></div>`}
const V={dash:['Resumen',vDash],tx:['Movimientos',vTx],cal:['Calendario',vCal],budget:['Presupuesto',vBudget],goals:['Objetivos',vGoals],debts:['Deudas',vDebts],ins:['Análisis',vInsights],set:['Ajustes',vSettings]};
function render(){const sc=window.scrollY;if(!CU)return renderLogin();document.querySelector('.app').removeAttribute('data-login');applyLook();const go=anim&&S.settings.anim!=='off'&&!matchMedia('(prefers-reduced-motion:reduce)').matches;anim=false;document.querySelectorAll('#curtain').forEach(c=>c.remove());
  document.title=S.settings.name;const bd=C.badge(C.upcoming());$('#nav').innerHTML=`<div class="brand">${esc(S.settings.name)}<div class="lbl" style="font:13px system-ui">${esc(CU.name)}</div></div>`+Object.entries(V).map(([k,v])=>`<button data-a="nav" data-v="${k}"${k===view?' aria-current="page"':''}>${v[0]}${k==='cal'&&bd?`<span class="bdg" aria-label="${bd} pendientes">${bd}</span>`:''}</button>`).join('')+'<button data-a="logout" style="margin-top:auto">Cambiar usuario</button>';
  const[s,e]=range(ym),showNav=view!=='set'&&view!=='goals'&&view!=='debts';
  $('#main').innerHTML=`<div class="top"><h1 class="ttl" aria-label="${esc(V[view][0])}">${ttl(V[view][0],go)}</h1>${showNav?`<div class="mnav"><button class="btn s sm" data-a="mm" data-d="-1" aria-label="Mes anterior">‹</button><h2>${mlabel(ym)}${S.settings.startDay>1?`<div class="lbl" style="text-transform:none;font:13px system-ui">${fdate(s)} – ${fdate(e)}</div>`:''}</h2><button class="btn s sm" data-a="mm" data-d="1" aria-label="Mes siguiente">›</button><input type="month" id="mp" value="${ym}" aria-label="Ir al mes" style="width:150px"><button class="btn s sm" data-a="mm" data-d="0">Hoy</button></div>`:''}</div><div class="stage">${V[view][1]()}</div>`;window.scrollTo(0,sc);play(go)}

/* ===== Exportar / importar ===== */
function dl(name,text,mime){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:mime}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
const csvc=v=>{v=String(v??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return/[",\n\r;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function exportCSV(){const h=['Fecha','Tipo','Descripción','Categoría','Importe','Estado','Tipo de movimiento','Método de pago','Frecuencia','Observaciones'];
  const rows=[...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='inc'?'Ingreso':'Gasto',t.desc,t.cat,t.amt,t.status==='done'?(t.type==='inc'?'Recibido':'Pagado'):'Pendiente',t.kind,t.method,FREQ[t.freq],t.notes]);
  dl('movimientos-'+today()+'.csv','\ufeff'+[h,...rows].map(r=>r.map(csvc).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function importFile(f){if(!f)return;if(f.size>20e6)return toast('Archivo demasiado grande (máx. 20 MB).');
  const r=new FileReader();r.onload=()=>{let n;try{n=clean(JSON.parse(r.result))}catch(e){return toast('Importación cancelada: '+(e instanceof SyntaxError?'el archivo no es JSON válido.':e.message))}
    confirmBox(`El respaldo contiene ${n.tx.length} movimientos, ${n.goals.length} objetivos y ${n.debts.length} deudas. Reemplazará TODOS los datos actuales (se guardará una copia de seguridad interna).`,()=>{store.set(BAK,JSON.stringify(S));S=n;persist();ym=curYM();genRecurring(ym);render();toast('Respaldo importado.')},'Reemplazar')};
  r.onerror=()=>toast('No se pudo leer el archivo.');r.readAsText(f)}

/* ===== Eventos ===== */
const A={
  close:()=>$('#dlg').close(),nav:e=>{view=e.dataset.v;anim=true;render()},
  mm:e=>{const d=+e.dataset.d;ym=d===0?curYM():addM(ym,d);if(genRecurring(ym))toast('Se generaron movimientos recurrentes pendientes.');render()},
  new:e=>txForm(e.dataset.t,null,e.dataset.d),day:e=>{ui.day=e.dataset.d;render()},rem:e=>remForm(S.reminders.find(x=>x.id===e.dataset.id),e.dataset.d),ics:exportICS,
  rdone:e=>{const r=S.reminders.find(x=>x.id===e.dataset.id),d=e.dataset.d;if(!r)return;r.done=r.done.includes(d)?r.done.filter(x=>x!==d):[...r.done,d];persist();render()},
  rdel:e=>{const r=S.reminders.find(x=>x.id===e.dataset.id);if(r)confirmBox(`¿Eliminar el recordatorio «${r.title}»${r.repeat!=='none'?' y todas sus repeticiones':''}?`,()=>{S.reminders=S.reminders.filter(x=>x!==r);persist();render()})},
  mat:e=>{const x=S.tx.find(t=>t.id===e.dataset.id),d=e.dataset.d;if(!x||S.tx.some(t=>t.recurOf===x.id&&t.date===d))return;S.tx.push({...x,id:uid(),date:d,status:'pending',recurOf:x.id,debtId:''});persist();render();toast('Gasto registrado como pendiente.')},edit:e=>{const t=S.tx.find(x=>x.id===e.dataset.id);if(t)txForm(t.type,t)},
  del:e=>{const t=S.tx.find(x=>x.id===e.dataset.id);if(t)confirmBox(`¿Eliminar «${t.desc}» por ${fmt(t.amt)}?`,()=>{if(t.recurOf)S.skipped.push(t.recurOf+'|'+t.date);S.tx=S.tx.filter(x=>x!==t);persist();render();toast('Movimiento eliminado.')})},
  tog:e=>{const t=S.tx.find(x=>x.id===e.dataset.id);if(t){t.status=t.status==='done'?'pending':'done';persist();render()}},
  sort:e=>{const k=e.dataset.k;ui.dir=ui.sort===k?-ui.dir:1;ui.sort=k;render()},pg:e=>{ui.page+=+e.dataset.d;render()},
  sbg:()=>{const v=$('#bg').value.trim(),n=v===''?0:Number(v);if(!Number.isFinite(n)||n<0||n>=1e13)return toast('Ingresa un presupuesto válido.');S.budget.general=norm(n);persist();render();toast('Presupuesto guardado.')},
  bc:e=>{const c=e.dataset.c;modal('Presupuesto de '+c,[{n:'v',l:'Monto mensual (0 para quitar)',t:'number'}],{v:S.budget.cats[c]||''},o=>{const n=norm(Number(o.v||0));if(n>0)S.budget.cats[c]=n;else delete S.budget.cats[c]})},
  goal:e=>goalForm(S.goals.find(x=>x.id===e.dataset.id)),
  gadd:e=>{const g=S.goals.find(x=>x.id===e.dataset.id);modal('Abonar a '+g.name,[{n:'v',l:'Monto a abonar',t:'number',r:1}],{},o=>{const n=norm(+o.v);if(!(n>0))return'El monto debe ser mayor que cero.';g.saved=r2(g.saved+n)})},
  gdel:e=>{const g=S.goals.find(x=>x.id===e.dataset.id);confirmBox(`¿Eliminar el objetivo «${g.name}»?`,()=>{S.goals=S.goals.filter(x=>x!==g);persist();render()})},
  debt:e=>debtForm(S.debts.find(x=>x.id===e.dataset.id)),pay:e=>payForm(S.debts.find(x=>x.id===e.dataset.id)),
  ddel:e=>{const d=S.debts.find(x=>x.id===e.dataset.id);confirmBox(`¿Eliminar la deuda «${d.name}»? Sus pagos ya registrados permanecen como gastos.`,()=>{S.tx.forEach(t=>{if(t.debtId===d.id)t.debtId=''});S.debts=S.debts.filter(x=>x!==d);persist();render()})},
  ac:e=>{const k=e.dataset.k,i=$(k==='inc'?'#ni':'#ne'),v=i.value.trim().slice(0,40);if(!v||BAD.includes(v))return toast('Escribe un nombre de categoría.');if(S.cats[k].some(c=>c.toLowerCase()===v.toLowerCase()))return toast('Esa categoría ya existe.');S.cats[k].push(v);persist();render()},
  rc:e=>{const k=e.dataset.k,c=e.dataset.c;if(S.tx.some(t=>t.type===k&&t.cat===c)||(k==='exp'&&S.budget.cats[c]))return toast('No se puede quitar: está en uso por movimientos o presupuestos.');if(S.cats[k].length<2)return toast('Debe quedar al menos una categoría.');S.cats[k]=S.cats[k].filter(x=>x!==c);persist();render()},
  xcsv:exportCSV,xjson:()=>dl('respaldo-presupuesto-'+today()+'.json',JSON.stringify(S,null,1),'application/json'),imp:()=>$('#fi').click(),
  logout:()=>{CU=null;S=def();loggedOut=true;LS={mode:'pick',id:''};render()},
  login:e=>{const u=R.list.find(x=>x.id===e.dataset.id);if(!u)return;if(u.hash){LS={mode:'pin',id:u.id};render()}else enter(u)},
  lnew:()=>{LS={mode:'new',id:''};render()},lpick:()=>{LS={mode:'pick',id:''};render()},
  rname:()=>modal('Cambiar nombre',[{n:'name',l:'Nombre',r:1}],{name:CU.name},o=>{const n=o.name.slice(0,40);if(R.list.some(u=>u!==CU&&u.name.toLowerCase()===n.toLowerCase()))return'Ya existe un usuario con ese nombre.';CU.name=n;wr()}),
  rpin:()=>modal(CU.hash?'Cambiar o quitar PIN':'Crear PIN',[...(CU.hash?[{n:'cur',l:'PIN actual',t:'password',r:1}]:[]),{n:'p1',l:'Nuevo PIN (vacío para quitarlo)',t:'password'},{n:'p2',l:'Repetir nuevo PIN',t:'password'}],{},async o=>{if(CU.hash&&await hp(o.cur,CU.salt)!==CU.hash)return'El PIN actual es incorrecto.';if(o.p1&&!/^\d{4,8}$/.test(o.p1))return'El PIN debe tener de 4 a 8 dígitos.';if(o.p1!==o.p2)return'Los PIN no coinciden.';if(o.p1){CU.salt=uid();CU.hash=await hp(o.p1,CU.salt)}else{CU.salt='';CU.hash=''}wr()}),
  ddelu:()=>{const go=()=>{[KEY,BAK,KEY+'.corrupt'].forEach(k=>store.del(k));R.list=R.list.filter(u=>u!==CU);wr();A.logout()};if(CU.hash)modal('Eliminar usuario',[{n:'cur',l:'Escribe tu PIN para confirmar',t:'password',r:1}],{},async o=>{if(await hp(o.cur,CU.salt)!==CU.hash)return'PIN incorrecto.';go()},'Eliminar');else confirmBox(`¿Eliminar a «${CU.name}» y TODOS sus datos? No se puede deshacer.`,go)},
  acc:e=>{S.settings.accent=e.dataset.c;persist();render()},prev:()=>{anim=true;render();if(S.settings.anim==='off')toast('La animación está desactivada.')},
  reset:()=>confirmBox('Se borrarán todos los datos de este usuario. Exporta un respaldo antes si lo necesitas.',()=>{store.set(BAK,JSON.stringify(S));S=def();ym=curYM();persist();render();toast('Datos borrados.')},'Borrar todo')
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener('change',e=>{const i=e.target.id;
  if(i==='mp'&&/^\d{4}-\d{2}$/.test(e.target.value)){ym=e.target.value;genRecurring(ym);render()}
  else if(i==='fi'){importFile(e.target.files[0]);e.target.value=''}
  else if(i==='an'||i==='asp'){S.settings[i==='an'?'anim':'speed']=e.target.value;persist();anim=true;render()}
  else if(i==='ac')render();
  else if(['ft','fc','fs','ff','fe'].includes(i)){const m={ft:'type',fc:'cat',fs:'scope',ff:'from',fe:'to'};ui[m[i]]=e.target.value;ui.page=1;render()}});
document.addEventListener('input',e=>{if(e.target.id==='ac'){S.settings.accent=e.target.value.toLowerCase();applyLook();persist()}if(e.target.id==='q'){ui.q=e.target.value;ui.page=1;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('submit',e=>{if(e.target.id!=='sf')return;e.preventDefault();const o=Object.fromEntries(new FormData(e.target)),sd=parseInt(o.startDay);
  if(!(sd>=1&&sd<=28))return $('#se').textContent='El primer día debe estar entre 1 y 28.';if(!o.symbol.trim())return $('#se').textContent='Indica un símbolo monetario.';
  Object.assign(S.settings,{name:o.name.trim().slice(0,60)||'Mi presupuesto',currency:o.currency,symbol:o.symbol.trim().slice(0,4),startDay:sd,theme:o.theme,pageSize:+o.pageSize});ym=curYM();persist();render();toast('Configuración guardada.')});
document.addEventListener('submit',async e=>{const id=e.target.id;if(id!=='nf'&&id!=='lf')return;e.preventDefault();const o=Object.fromEntries(new FormData(e.target)),er=m=>{$('#le').textContent=m};
  if(id==='nf'){const name=o.name.trim().slice(0,40);if(!name)return er('Escribe un nombre.');if(R.list.some(u=>u.name.toLowerCase()===name.toLowerCase()))return er('Ya existe un usuario con ese nombre.');
    if(o.pin&&!/^\d{4,8}$/.test(o.pin))return er('El PIN debe tener de 4 a 8 dígitos.');if(o.pin!==o.pin2)return er('Los PIN no coinciden.');
    const u={id:uid(),name,salt:'',hash:''};if(o.pin){u.salt=uid();u.hash=await hp(o.pin,u.salt)}R.list.push(u);wr();enter(u,true)}
  else{const u=R.list.find(x=>x.id===LS.id);if(!u)return;if(Date.now()<lockUntil)return er('Demasiados intentos. Espera 30 segundos.');
    if(await hp(o.pin,u.salt)===u.hash){fails=0;enter(u)}else{if(++fails>=5){lockUntil=Date.now()+30000;fails=0}er('PIN incorrecto.')}}});
function tick(){const t=today();if(!lastDay)lastDay=t;if(t===lastDay)return;lastDay=t;if(!CU)return;const was=ym===lastCur;lastCur=curYM();if(was)ym=lastCur;genRecurring(ym);if(!$('#dlg').open)render()}
lastDay=today();setInterval(tick,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
boot();
</script></body></html>
